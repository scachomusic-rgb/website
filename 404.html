<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 | scacha</title>
  <meta name="robots" content="noindex">

  <link rel="icon" href="https://f4.bcbits.com/img/0047109205_20.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #111;
      --muted: #777;
      --line: #dedede;
      --background: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--background);
      font-family: "Inter", Arial, sans-serif;
      font-size: 11px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100% - 48px, 1120px);
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .logo img {
      display: block;
      width: 88px;
      height: auto;
    }

    .nav {
      display: flex;
      gap: 24px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .nav a,
    .footer,
    .error-code,
    .message {
      color: var(--muted);
    }

    .nav a,
    .footer a {
      transition: color .2s ease;
    }

    .nav a:hover,
    .footer a:hover {
      color: var(--text);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 0;
    }

    .error-code {
      margin: 0;
      font-size: clamp(80px, 18vw, 160px);
      font-weight: 400;
      letter-spacing: -.09em;
      line-height: .9;
    }

    h1 {
      margin: 30px 0 0;
      font-size: 13px;
      font-weight: 500;
    }

    .message {
      margin: 8px 0 0;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 30px;
    }

    .button {
      display: inline-block;
      padding: 9px 14px;
      border: 1px solid var(--line);
      transition: border-color .2s ease;
    }

    .button:hover {
      border-color: var(--text);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      padding: 20px 0 26px;
      border-top: 1px solid var(--line);
      font-size: 10px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    @media (max-width: 650px) {
      .page {
        width: calc(100% - 32px);
      }

      .header {
        height: 68px;
      }

      .logo img {
        width: 78px;
      }

      .nav {
        gap: 14px;
      }

      .footer {
        flex-direction: column;
      }
    }

    @media (max-width: 360px) {
      .page {
        width: calc(100% - 24px);
      }

      .nav {
        gap: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="header">
      <a class="logo" href="/" aria-label="scacha home">
        <img src="/scacha-logo-black.png" alt="scacha">
      </a>

      <nav class="nav" aria-label="main navigation">
        <a href="/music/">music</a>
        <a href="/about-me/">about</a>
        <a href="mailto:aron@scacha11111.com">contact</a>
      </nav>
    </header>

    <main>
      <p class="error-code">404</p>
      <h1>page not found</h1>
      <p class="message">this page doesn't exist or has been moved.</p>

      <nav class="actions" aria-label="error navigation">
        <a class="button" href="/">back to home</a>
        <a class="button" href="/music/">browse music</a>
      </nav>
    </main>

    <footer class="footer">
      <span>© 2026 warm palm recordings. all rights reserved.</span>

      <div class="footer-links">
        <a href="https://www.instagram.com/scacha11111/" target="_blank" rel="noopener noreferrer">instagram</a>
        <a href="https://scacha11111.bandcamp.com/" target="_blank" rel="noopener noreferrer">bandcamp</a>
        <a href="mailto:aron@scacha11111.com">email</a>
      </div>
    </footer>

  </div>
</body>
</html>
