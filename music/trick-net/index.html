
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>trick / net | scacha</title>
  <meta name="description" content="trick / net">

  <link rel="icon" href="https://f4.bcbits.com/img/0047109205_20.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- release data -->

  <script>
    const release = {
      title: "trick / net",
      artist: "scacha",
      catalogue: "wpr001de",
      date: "2026-08-26",
      type: "maxi-single",
      label: "warm palm recordings",

      description: "trick / net — is the first maxi-single from scacha's debut mixtape, sonder. the release contains the projects first two tracks, trick and net, offering the first glimpse into the sound, atmosphere, and emotional world of the mixtape. together, the two tracks open sonder and introduce its fragmented, electronic landscape. the physical release features one track on each side, with 'trick' on side a and 'net' on side b.",

      cover: "/trick-net-artwork.jpg",

      gallery: [],

      formats: [
          {
          name: "digital [sonder]",
          description: "stream mixtape",
          price: "",
          status: "",
          action: "stream",
          url: "https://ffm.to/sndr"
        },
        {
          name: "lathe-cut vinyl",
          description: "issued on 12-inch lathe-cut vinyl. hand-writting design by scacha.",
          price: "31.90 $",
          status: "",
          action: "buy",
          url: "https://elasticstage.com/scacha/releases/trick-net-singleep"
        }
      ],

      tracks: [
        { name: "trick", duration: "2:27" },
        { name: "net", duration: "2:36" }
      ],

      bonusTracks: [],
      bonusNote: "",

      credits: [
        ["written by", "aron miego"],
        ["produced by", "scacha"],
        ["performed by", "scacha"],
        ["mixed by", "scacha"],
        ["instrumentation programmed and recorded by", "scacha"],
        ["published by", "сopyright сontrol"],
        ["artwork by", "scacha"],
        ["photography by", "@talk2medonttalk2me", "https://www.instagram.com/talk2medonttalk2me/", "used with permission"]
      ],

      copyright: "© 2026 warm palm recordings",
      phonogram: "℗ 2026 warm palm recordings"
    };
  </script>

  <style>
    :root {
      --text: #111;
      --muted: #777;
      --line: #dedede;
      --background: #fff;
      --hover: #f4f4f4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family: "Inter", Arial, sans-serif;
      font-size: 11px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(100% - 48px, 1120px);
      margin: 0 auto;
    }

    .header {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .logo img {
      display: block;
      width: 88px;
      height: auto;
    }

    .nav {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .nav a {
      color: var(--muted);
      transition: color .2s ease;
    }

    .nav a:hover {
      color: var(--text);
    }

    .release-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(320px, .9fr);
      gap: clamp(30px, 5vw, 72px);
      align-items: start;
      padding-top: 30px;
    }

    .artwork-column {
      min-width: 0;
    }

    .main-artwork {
      display: block;
      width: 100%;
      height: auto;
      background: #f3f3f3;
      object-fit: cover;
    }

    .main-artwork[hidden] {
      display: none;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .gallery:empty {
      display: none;
    }

    .gallery-image {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #f3f3f3;
    }

    .gallery-image[hidden] {
      display: none;
    }

    .release-details {
      min-width: 0;
    }

    .release-title {
      margin: 0;
      font-size: clamp(28px, 3.3vw, 36px);
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .release-artist {
      display: inline-block;
      margin-top: 3px;
      font-size: clamp(23px, 2.6vw, 29px);
      line-height: 1.1;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .release-identification {
      margin-top: 30px;
      color: var(--muted);
      font-size: 10px;
    }

    .release-identification p {
      margin: 0 0 3px;
    }

    .release-description {
      margin: 20px 0 24px;
      max-width: 430px;
      line-height: 1.7;
    }

    .formats-heading {
      margin: 0;
      padding: 0 0 8px;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      font-weight: 500;
    }

    .format {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .format-name {
      margin: 0;
      font-weight: 600;
    }

    .format-description {
      margin: 2px 0 0;
      color: var(--muted);
    }

    .format-action {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 7px;
    }

    .format-price,
    .format-status {
      min-height: 16px;
      font-weight: 600;
      text-align: right;
    }

    .format-link {
      display: inline-block;
      padding: 4px 9px;
      border: 1px solid #cfcfcf;
      background: #fff;
      color: var(--text);
      text-align: center;
      white-space: nowrap;
      transition: background .2s ease, border-color .2s ease;
    }

    .format-link:hover {
      background: var(--hover);
      border-color: #999;
    }

    .format-link[hidden] {
      display: none;
    }

    .format-status:empty,
    .format-price:empty {
      display: none;
    }

    .content-section {
      margin-top: 38px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .section-heading h2 {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
    }

    .section-note {
      color: var(--muted);
      font-size: 10px;
    }

    .tracklist {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .track {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) 42px;
      gap: 8px;
      align-items: baseline;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }

    .track-number {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .track-name {
      overflow-wrap: anywhere;
    }

    .track-duration {
      color: var(--muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .bonus-heading {
      margin: 25px 0 0;
      color: var(--muted);
      font-size: 10px;
      font-weight: 400;
    }

    .credits {
      margin: 0;
      padding: 0;
    }

    .credit {
      display: grid;
      grid-template-columns: minmax(100px, .7fr) minmax(0, 1.3fr);
      gap: 18px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }

    .credit dt {
      color: var(--muted);
    }

    .credit dd {
      margin: 0;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .credit a {
      text-decoration: underline;
      text-decoration-color: #bdbdbd;
      text-underline-offset: 3px;
      transition: text-decoration-color .2s ease;
    }

    .credit a:hover {
      text-decoration-color: #111;
    }

    .legal {
      margin-top: 22px;
      color: var(--muted);
      font-size: 10px;
      text-align: left;
    }

    .legal p {
      margin: 3px 0;
      padding: 0;
      text-indent: 0;
      text-align: left;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-top: 42px;
      padding: 20px 0 26px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    .footer a:hover {
      color: var(--text);
    }

    @media (min-width: 1000px) {
      .release-details {
        position: sticky;
        top: 28px;
      }
    }

    @media (max-width: 720px) {
      .page {
        width: calc(100% - 32px);
      }

      .release-layout {
        grid-template-columns: 1fr;
        gap: 34px;
        padding-top: 20px;
      }

      .release-title {
        font-size: 32px;
      }

      .release-artist {
        font-size: 25px;
      }

      .release-identification {
        margin-top: 22px;
      }

      .content-section {
        margin-top: 32px;
      }

      .footer {
        flex-direction: column;
        margin-top: 50px;
      }
    }

    @media (max-width: 380px) {
      .page {
        width: calc(100% - 24px);
      }

      .nav {
        gap: 12px;
      }

      .logo img {
        width: 74px;
      }

      .format {
        gap: 6px;
      }

      .format-link {
        padding: 4px 6px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="header">
      <a class="logo" href="/" aria-label="scacha home">
        <img src="/scacha-logo-black.png" alt="scacha">
      </a>

      <nav class="nav" aria-label="main navigation">
        <a href="/music/">music</a>
        <a href="/about-me/">about</a>
        <a href="mailto:aron@scacha11111.com">contact</a>
      </nav>
    </header>

    <main>
      <div class="release-layout">

        <section class="artwork-column" aria-label="release artwork">
          <img id="main-artwork" class="main-artwork" alt="" hidden>
          <div id="gallery" class="gallery"></div>
        </section>

        <section class="release-details">
          <h1 id="release-title" class="release-title"></h1>
          <a id="release-artist" class="release-artist" href="/"></a>

          <div class="release-identification">
            <p id="catalogue"></p>
            <p id="release-date"></p>
            <p id="release-label"></p>
          </div>

          <p id="release-description" class="release-description"></p>

          <h2 class="formats-heading">available editions</h2>
          <div id="formats"></div>

          <section class="content-section" id="track-section">
            <div class="section-heading">
              <h2>tracklist</h2>
              <span id="track-count" class="section-note"></span>
            </div>

            <ol id="tracklist" class="tracklist"></ol>

            <h3 id="bonus-heading" class="bonus-heading"></h3>
            <ol id="bonus-tracks" class="tracklist"></ol>
          </section>

          <section class="content-section" id="credits-section">
            <div class="section-heading">
              <h2>credits</h2>
            </div>

            <dl id="credits" class="credits"></dl>

            <div class="legal">
              <p id="copyright"></p>
              <p id="phonogram"></p>
              <p id="legal-catalogue"></p>
            </div>
          </section>
        </section>

      </div>
    </main>

    <footer class="footer">
      <span id="footer-copyright"></span>

      <div class="footer-links">
        <a href="https://www.instagram.com/scacha11111/" target="_blank" rel="noopener noreferrer">instagram</a>
        <a href="https://scacha11111.bandcamp.com/" target="_blank" rel="noopener noreferrer">bandcamp</a>
        <a href="mailto:aron@scacha11111.com">email</a>
      </div>
    </footer>

  </div>

  <script>
    function setText(id, value) {
      const element = document.getElementById(id);
      element.textContent = value || "";
      element.hidden = !value;
    }

    document.title =
      [release.title, release.artist].filter(Boolean).join(" — ") || "release";

    setText("release-title", release.title);
    setText("release-artist", release.artist);
    setText("catalogue", release.catalogue);
    setText("release-date", release.date);
    setText("release-label", release.label);
    setText("release-description", release.description);
    setText("copyright", release.copyright);
    setText("phonogram", release.phonogram);
    setText("legal-catalogue", release.catalogue);
    setText("footer-copyright", release.copyright);

    const artistLink = document.getElementById("release-artist");
    artistLink.href = "/";

    // main artwork

    const mainArtwork = document.getElementById("main-artwork");

    if (release.cover) {
      mainArtwork.src = release.cover;
      mainArtwork.alt = (release.title || "release") + " artwork";
      mainArtwork.hidden = false;
    }

    // additional photographs

    const gallery = document.getElementById("gallery");

    (release.gallery || []).filter(Boolean).forEach((src) => {
      if (src === release.cover) return;

      const image = document.createElement("img");
      image.className = "gallery-image";
      image.src = src;
      image.alt = (release.title || "release") + " additional photograph";
      image.loading = "lazy";

      image.addEventListener("error", () => {
        image.hidden = true;
      }, { once: true });

      gallery.appendChild(image);
    });

    // formats

    const formatsElement = document.getElementById("formats");

    (release.formats || []).forEach((format) => {
      const row = document.createElement("div");
      row.className = "format";

      const details = document.createElement("div");

      const name = document.createElement("p");
      name.className = "format-name";
      name.textContent = format.name || "";

      const description = document.createElement("p");
      description.className = "format-description";
      description.textContent = format.description || "";

      details.append(name, description);

      const action = document.createElement("div");
      action.className = "format-action";

      const status = document.createElement("span");
      status.className = "format-status";
      status.textContent = format.status || "";

      const price = document.createElement("span");
      price.className = "format-price";
      price.textContent = format.price || "";

      const link = document.createElement("a");
      link.className = "format-link";
      link.textContent = format.action || "buy";
      link.href = format.url || "#";

      if (!format.url) {
        link.hidden = true;
      }

      if (/^https?:\/\//i.test(format.url || "")) {
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      }

      action.append(status, price, link);
      row.append(details, action);
      formatsElement.appendChild(row);
    });

    // main tracklist

    const tracklist = document.getElementById("tracklist");

    (release.tracks || []).forEach((track, index) => {
      const item = document.createElement("li");
      item.className = "track";

      const number = document.createElement("span");
      number.className = "track-number";
      number.textContent = String(index + 1).padStart(2, "0");

      const name = document.createElement("span");
      name.className = "track-name";
      name.textContent = typeof track === "string" ? track : track.name;

      const duration = document.createElement("span");
      duration.className = "track-duration";
      duration.textContent =
        typeof track === "string" ? "" : (track.duration || "");

      if (duration.textContent) {
        duration.setAttribute(
          "aria-label",
          "duration " + duration.textContent
        );
      }

      item.append(number, name, duration);
      tracklist.appendChild(item);
    });

    setText(
      "track-count",
      release.tracks && release.tracks.length
        ? release.tracks.length + " tracks"
        : ""
    );

    if (!(release.tracks || []).length && !(release.bonusTracks || []).length) {
      document.getElementById("track-section").hidden = true;
    }

    // bonus tracks

    const bonusHeading = document.getElementById("bonus-heading");
    const bonusList = document.getElementById("bonus-tracks");

    if ((release.bonusTracks || []).length > 0) {
      bonusHeading.textContent = release.bonusNote || "bonus tracks";

      release.bonusTracks.forEach((track, index) => {
        const item = document.createElement("li");
        item.className = "track";

        const number = document.createElement("span");
        number.className = "track-number";
        number.textContent = String(index + 1).padStart(2, "0");

        const name = document.createElement("span");
        name.className = "track-name";
        name.textContent = typeof track === "string" ? track : track.name;

        const duration = document.createElement("span");
        duration.className = "track-duration";
        duration.textContent =
          typeof track === "string" ? "" : (track.duration || "");

        if (duration.textContent) {
          duration.setAttribute(
            "aria-label",
            "duration " + duration.textContent
          );
        }

        item.append(number, name, duration);
        bonusList.appendChild(item);
      });
    } else {
      bonusHeading.hidden = true;
      bonusList.hidden = true;
    }

    // credits

    const creditsElement = document.getElementById("credits");

    (release.credits || []).forEach(([role, person, url, note]) => {
      const row = document.createElement("div");
      row.className = "credit";

      const term = document.createElement("dt");
      term.textContent = role || "";

      const description = document.createElement("dd");

      if (url) {
        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = person || "";
        description.appendChild(link);
      } else {
        description.appendChild(document.createTextNode(person || ""));
      }

      if (note) {
        description.appendChild(document.createTextNode(", " + note));
      }

      row.append(term, description);
      creditsElement.appendChild(row);
    });

    if (
      !(release.credits || []).length &&
      !release.copyright &&
      !release.phonogram &&
      !release.catalogue
    ) {
      document.getElementById("credits-section").hidden = true;
    }
  </script>
</body>
</html>
