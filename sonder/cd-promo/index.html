<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>sonder cd promo</title>
    <link rel="icon" type="image/png" href="https://f4.bcbits.com/img/0047109205_20.jpg">
    <meta name="description" content="sonder cd promo">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: black;
        }

        body {
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .page {
            background-color: black;
            color: white;
            min-height: 100vh;
            width: 100%;
            box-sizing: border-box;
            padding: 20px 0;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        h3 {
            margin-top: 0;
        }

        .animated-link {
            color: white;
            transition: color 1s ease;
        }

        .animated-link:hover {
            color: #4d7cff;
        }

        .scan {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        body.js-ready .scan {
            opacity: 0
        }

        body.js-ready .scan.show {
            opacity: 1
            transform: translateY(0);
        }
        
    </style>
</head>

<script>
    document.body.classList.add('js-ready');

    const scans = document.querySelectorAll('.scan');

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('show');
                observer.unobserve(entry.target);
            }
        });
    }, {
        threshold: 0.15
    });

    scans.forEach(scan => {
        observer.observe(scan);
    });
</script>

<body>

<div class="page">

    <section class="cd-promo-wrapped">
                <div style="display: flex; justify-content: center; gap: 30px; margin-bottom: 30px;">
                    <img class="scan" src="case_wrapped_front.jpg" style="width: 600px; height: auto;">
                    <img class="scan" src="case_wrapped_back.jpg" style="width: 600px; height: auto;">
                </div>
            </section>

    <section class="cd-promo-case">
                <div style="display: flex; justify-content: center; gap: 30px; margin-bottom: 30px;">
                    <img class="scan" src="case_front.jpg" style="width: 600px; height: auto;">
                    <img class="scan" src="case_out.jpg" style="width: 600px; height: auto;">
                </div>
            </section>

    <section class="cd-promo-card">
                <div style="display: flex; justify-content: center; gap: 30px; margin-bottom: 30px;">
                    <img class="scan" src="card_in.jpg" style="width: 600px; height: auto;">
                    <img class="scan" src="card_out.jpg" style="width: 600px; height: auto;">
                </div>
            </section>
    
    <section class="cd-promo-disc">
                    <div style="display: flex; justify-content: center; gap: 30px; margin-bottom: 30px;">
                        <img class="scan" src="cd_front.jpg" style="width: 600px; height: auto;">
                        <img class="scan" src="cd_back.jpg" style="width: 600px; height: auto;">
                    </div>
                </section>

    <section class="cd-promo-code-card">
                <div style="display: flex; justify-content: center; gap: 30px; margin-bottom: 30px;">
                    <img class="scan" src="code-card.jpg" style="width: 600px; height: auto;">
                </div>
            </section>

    <footer style="text-align: center; margin-top: 40px; font-size: 14px; color: #888888;">
        <p>
            <span style="color: #ffffff;">
                &copy; 2026 warm palm recordings. all rights reserved.
            </span>
        </p>
    </footer>

</div>

</body>
</html>
