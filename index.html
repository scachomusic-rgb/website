<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>scacha | official website</title>
    <meta name="description" content="scacha's official website. explore music releases, physical editions and the artist archive.">
    <meta name="theme-color" content="#ffffff">

    <link rel="icon" type="image/jpeg"
          href="https://f4.bcbits.com/img/0047109205_20.jpg">

    <link rel="canonical" href="https://www.scacha11111.com/">

    <meta property="og:type" content="website">
    <meta property="og:title" content="scacha | official website">
    <meta property="og:description" content="scacha's official website. explore music releases, physical editions and the artist archive.">
    <meta property="og:url" content="https://www.scacha11111.com/">
    <meta property="og:image" content="https://www.scacha11111.com/about-me/face_6000.jpg.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #ffffff;
        }

        body {
            color: #111111;
            font-family: Arial, Helvetica, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .page {
            min-height: 100vh;
            width: 100%;
            padding: 28px 20px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            text-align: center;
        }

        .logo {
            display: block;
            width: min(350px, 85vw);
            height: auto;
            margin: 0 auto;
        }

        .subtitle {
            margin: 8px 0 0;
            color: #777777;
            font-size: 10px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        /* release announcement */

        .announcement {
            width: 100%;
            max-width: 430px;
            margin-top: 30px;
            padding: 13px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            border-bottom: 1px solid #e8e8e8;
            color: #777777;
            font-size: 11px;
        }

        .announcement-title {
            color: #111111;
            font-weight: 500;
        }

        .announcement-date {
            flex-shrink: 0;
            white-space: nowrap;
        }

        main {
            width: 100%;
            max-width: 430px;
            margin: 32px auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-label {
            align-self: flex-start;
            margin: 0 0 12px;
            color: #777777;
            font-size: 10px;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        .artwork-link {
            display: block;
            width: 100%;
            overflow: hidden;
            line-height: 0;
            background: #f5f5f5;
        }

        .artwork {
            display: block;
            width: 100%;
            height: auto;
            transition: opacity 180ms ease;
        }

        .artwork-link:hover .artwork {
            opacity: 0.9;
        }

        .release-title {
            margin: 20px 0 5px;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.035em;
            line-height: 1.2;
        }

        .release-description {
            margin: 0;
            color: #777777;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }

        .buttons {
            width: 100%;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .button {
            display: flex;
            min-height: 46px;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            border: 1px solid #111111;
            background: #ffffff;
            color: #111111;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-align: center;
            text-decoration: none;
            text-transform: uppercase;
            transform: scale(1);
            transition:
                transform 180ms ease,
                background-color 180ms ease,
                color 180ms ease;
        }

        .button:hover {
            transform: scale(1.025);
        }

        .button-primary {
            background: #111111;
            color: #ffffff;
        }

        .button-primary:hover {
            background: #333333;
        }

        .button-secondary:hover {
            background: #f2f2f2;
        }

        .button:focus-visible {
            outline: 2px solid #777777;
            outline-offset: 4px;
        }

        footer {
            width: 100%;
            margin-top: auto;
            padding-top: 48px;
            color: #888888;
            font-size: 10px;
            line-height: 1.6;
            letter-spacing: 0.04em;
            text-align: center;
        }

        footer p {
            margin: 0;
        }

        @media (max-width: 600px) {
            .page {
                padding: 20px 18px 16px;
            }

            .logo {
                width: min(290px, 82vw);
            }

            .announcement {
                margin-top: 24px;
                align-items: flex-start;
                flex-direction: column;
                gap: 2px;
            }

            main {
                max-width: 390px;
                margin-top: 28px;
            }

            footer {
                padding-top: 40px;
            }
        }

        @media (max-width: 360px) {
            .page {
                padding-right: 18px;
                padding-left: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="page">

        <header>
            <img
                class="logo"
                src="/scacha-logo-black.png"
                alt="scacha"
                width="350"
                height="350"
            >

            <p class="subtitle">official website</p>
        </header>

        <aside class="announcement" aria-label="upcoming release">
            <span>
                new single <span class="announcement-title">apart</span>
            </span>
            <span class="announcement-date">coming nov 4, 2026</span>
        </aside>

        <main>
            <p class="section-label">upcoming release / wpr004de</p>

            <a
                class="artwork-link"
                href="/music/apart/"
                aria-label="view sonder release"
            >
                <img
                    class="artwork"
                    src="/apart-artwork.jpg"
                    alt="scacha — sonder album artwork"
                    width="500"
                    height="500"
                >
            </a>

            <h1 class="release-title">apart</h1>

            <p class="release-description">
                new track by scacha
            </p>

            <nav class="buttons" aria-label="main navigation">
                <a class="button button-primary" href="/music/apart/">
                    pre-order
                </a>

                <a class="button button-secondary" href="/music/">
                    browse catalog
                </a>
            </nav>
        </main>

        <footer>
            <p>&copy; 2026 warm palm recordings. all rights reserved.</p>
        </footer>

    </div>
</body>
</html>
