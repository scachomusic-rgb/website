
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>scacha | official website</title>
    <meta name="description" content="scacha's official website. explore music releases, physical editions and the artist archive.">
    <meta name="theme-color" content="#ffffff">

    <link rel="icon" type="image/jpeg"
          href="https://f4.bcbits.com/img/0047109205_20.jpg">

    <link rel="canonical" href="https://www.scacha11111.com/">

    <meta property="og:type" content="website">
    <meta property="og:title" content="scacha | official website">
    <meta property="og:description" content="explore music releases and physical editions by scacha.">
    <meta property="og:url" content="https://www.scacha11111.com/">
    <meta property="og:image" content="https://www.scacha11111.com/sonder-artwork.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #ffffff;
        }

        body {
            color: #111111;
            font-family: Arial, Helvetica, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .page {
            min-height: 100vh;
            width: 100%;
            padding: 28px 20px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            text-align: center;
        }

        .logo {
            display: block;
            width: min(350px, 85vw);
            height: auto;
            margin: 0 auto;
        }

        .subtitle {
            margin: 8px 0 0;
            color: #777777;
            font-size: 10px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        main {
            width: 100%;
            max-width: 430px;
            margin: 48px auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-label {
            align-self: flex-start;
            margin: 0 0 12px;
            color: #777777;
            font-size: 10px;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        .artwork-link {
            display: block;
            width: 100%;
            overflow: hidden;
            line-height: 0;
            background: #f5f5f5;
        }

        .artwork {
            display: block;
            width: 100%;
            height: auto;
            transition: opacity 180ms ease;
        }

        .artwork-link:hover .artwork {
            opacity: 0.9;
        }

        .release-title {
            margin: 20px 0 5px;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.035em;
            line-height: 1.2;
        }

        .release-description {
            margin: 0;
            color: #777777;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }

        .buttons {
            width: 100%;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .button {
            display: flex;
            min-height: 46px;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            border: 1px solid #111111;
            background: #ffffff;
            color: #111111;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-align: center;
            text-decoration: none;
            text-transform: uppercase;
            transform: scale(1);
            transition:
                transform 180ms ease,
                background-color 180ms ease,
                color 180ms ease;
        }

        .button:hover {
            transform: scale(1.025);
        }

        .button-primary {
            background: #111111;
            color: #ffffff;
        }

        .button-primary:hover {
            background: #333333;
        }

        .button-secondary:hover {
            background: #f2f2f2;
        }

        .button:focus-visible {
            outline: 2px solid #777777;
            outline-offset: 4px;
        }

        footer {
            width: 100%;
            margin-top: auto;
            padding-top: 48px;
            color: #888888;
            font-size: 10px;
            line-height: 1.6;
            letter-spacing: 0.04em;
            text-align: center;
        }

        footer p {
            margin: 0;
        }

        @media (max-width: 600px) {
            .page {
                padding: 20px 18px 16px;
            }

            .logo {
                width: min(290px, 82vw);
            }

            main {
                max-width: 390px;
                margin-top: 38px;
            }

            footer {
                padding-top: 40px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="page">

        <header>
            <img
                class="logo"
                src="/scacha-logo-black.png"
                alt="scacha"
                width="350"
                height="350"
            >

            <p class="subtitle">official website</p>
        </header>

        <main>
            <p class="section-label">recent release / wpr002de</p>

            <a
                class="artwork-link"
                href="/sonder/"
                aria-label="view sonder release"
            >
                <img
                    class="artwork"
                    src="/sonder-artwork.jpg"
                    alt="scacha — sonder album artwork"
                    width="500"
                    height="500"
                >
            </a>

            <h1 class="release-title">sonder</h1>

            <p class="release-description">
                the debut mixtape by scacha
            </p>

            <nav class="buttons" aria-label="main navigation">
                <a class="button button-primary" href="/sonder/">
                    view release ↗
                </a>

                <a class="button button-secondary" href="/music/">
                    browse catalog ↗
                </a>
            </nav>
        </main>

        <footer>
            <p>&copy; 2026 warm palm recordings. all rights reserved.</p>
        </footer>

    </div>
</body>
</html>
