<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>blog | scacha</title>
  <meta name="description" content="notes, stories and ideas behind the works of scacha.">

  <link rel="icon" href="https://f4.bcbits.com/img/0047109205_20.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --background: #ffffff;
      --text: #111111;
      --muted: #777777;
      --line: #e8e8e8;
      --hover: #f5f5f5;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "Inter", Arial, sans-serif;
      font-size: 12px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .page {
      width: min(100% - 48px, 1440px);
      margin: 0 auto;
    }

    /* header */

    .header {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    .logo img {
      display: block;
      width: 94px;
      height: auto;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 25px;
      flex-wrap: wrap;
    }

    .nav a {
      color: var(--muted);
      transition: color 0.2s ease;
    }

    .nav a:hover,
    .nav a.active {
      color: var(--text);
    }

    /* page heading */

    .intro {
      padding: 48px 0 28px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.1;
      font-weight: 400;
      letter-spacing: -0.055em;
    }

    .intro-description {
      margin: 12px 0 0;
      max-width: 420px;
      color: var(--muted);
      font-size: 12px;
    }

    /* catalog controls */

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      padding: 16px 0;
      margin-bottom: 24px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .sort-control {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
      color: var(--muted);
    }

    .sort-control label {
      white-space: nowrap;
    }

    .sort-control select {
      max-width: 150px;
      padding: 7px 20px 7px 8px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      outline-offset: 3px;
    }

    /* article grid */

    .catalog {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 38px 18px;
      min-height: 120px;
    }

    .article-card {
      min-width: 0;
    }

    .article-cover-link {
      display: block;
      overflow: hidden;
      background: #f3f3f3;
      aspect-ratio: 1 / 1;
    }

    .article-cover {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition:
        transform 0.35s ease,
        opacity 0.35s ease;
    }

    .article-cover-link:hover .article-cover {
      transform: scale(1.025);
      opacity: 0.92;
    }

    .article-info {
      padding-top: 13px;
    }

    .article-date {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 10px;
    }

    .article-title {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 500;
    }

    .article-title a {
      transition: opacity 0.2s ease;
    }

    .article-title a:hover {
      opacity: 0.55;
    }

    .article-description {
      margin: 7px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .article-read {
      display: inline-block;
      margin-top: 12px;
      font-size: 10px;
      text-decoration: underline;
      text-decoration-color: #bdbdbd;
      text-underline-offset: 3px;
      transition: text-decoration-color 0.2s ease;
    }

    .article-read:hover {
      text-decoration-color: var(--text);
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 50px 0;
      color: var(--muted);
      text-align: center;
    }

    .results-count {
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 10px;
    }

    /* footer */

    .footer {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-top: 90px;
      padding: 22px 0 28px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
    }

    .footer-links {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .footer a {
      transition: color 0.2s ease;
    }

    .footer a:hover {
      color: var(--text);
    }

    /* responsive layout */

    @media (max-width: 1000px) {
      .catalog {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 650px) {
      .page {
        width: calc(100% - 32px);
      }

      .header {
        min-height: 68px;
      }

      .logo img {
        width: 78px;
      }

      .nav {
        gap: 14px;
      }

      .intro {
        padding-top: 36px;
      }

      .catalog {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px 12px;
      }

      .article-info {
        padding-top: 10px;
      }

      .footer {
        flex-direction: column;
        margin-top: 60px;
      }
    }

    @media (max-width: 360px) {
      .page {
        width: calc(100% - 24px);
      }

      .nav {
        gap: 10px;
      }

      .catalog {
        gap: 24px 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <!-- blog data -->

  <script>
    const articles = [
      {
        title: "about 'apart'",
        date: "2026-11-03",
        description: "a closer look at a piano-written ballad.",
        cover: "/apart-artwork.jpg",
        page: "/blog/02-about-apart/"
      },
      
      {
        title: "the origins of 'sonder'",
        date: "2026-11-01",
        description: "a closer look at scacha's debut mixtape.",
        cover: "/sonder-artwork.jpg",
        page: "/blog/01-the-origins-of-sonder/"
      }
    ];
  </script>
</head>

<body>
  <div class="page">

    <header class="header">
      <a class="logo" href="/" aria-label="scacha home">
        <img src="/scacha-logo-black.png" alt="scacha">
      </a>

      <nav class="nav" aria-label="main navigation">
        <a href="/music/">music</a>
        <a class="active" href="/blog/" aria-current="page">blog</a>
        <a href="/about-me/">about</a>
        <a href="mailto:aron@scacha11111.com">contact</a>
      </nav>
    </header>

    <main>
      <section class="intro">
        <p class="eyebrow">scacha / journal</p>
        <h1>blog</h1>
        <p class="intro-description">
          notes, stories and ideas behind the works of scacha.
        </p>
      </section>

      <section class="toolbar" aria-label="blog controls">
        <div class="sort-control">
          <label for="sort">sort by</label>
          <select id="sort">
            <option value="newest">newest</option>
            <option value="oldest">oldest</option>
          </select>
        </div>
      </section>

      <section
        id="catalog"
        class="catalog"
        aria-label="blog articles"
        aria-live="polite"
      ></section>

      <p id="results-count" class="results-count"></p>
    </main>

    <footer class="footer">
      <span>© 2026 warm palm recordings. all rights reserved.</span>

      <div class="footer-links">
        <a
          href="https://www.instagram.com/scacha11111/"
          target="_blank"
          rel="noopener noreferrer"
        >instagram</a>

        <a
          href="https://scacha11111.bandcamp.com/"
          target="_blank"
          rel="noopener noreferrer"
        >bandcamp</a>

        <a href="mailto:aron@scacha11111.com">email</a>
      </div>
    </footer>

  </div>

  <script>
    const catalogElement = document.getElementById("catalog");
    const resultsCount = document.getElementById("results-count");
    const sortSelect = document.getElementById("sort");

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (text !== undefined && text !== null) {
        element.textContent = text;
      }

      return element;
    }

    function formatDate(date) {
      if (!date) return "";

      const parsed = new Date(date + "T00:00:00");

      if (Number.isNaN(parsed.getTime())) {
        return date;
      }

      return new Intl.DateTimeFormat("en", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      }).format(parsed).toLowerCase();
    }

    function createArticleCard(article) {
      const card = makeElement("article", "article-card");

      const coverLink = makeElement("a", "article-cover-link");
      coverLink.href = article.page || "#";
      coverLink.setAttribute("aria-label", "read " + article.title);

      const image = makeElement("img", "article-cover");
      image.src = article.cover;
      image.alt = article.title + " artwork";
      image.loading = "lazy";
      image.decoding = "async";

      image.addEventListener("error", () => {
        image.style.visibility = "hidden";
      }, { once: true });

      coverLink.appendChild(image);
      card.appendChild(coverLink);

      const info = makeElement("div", "article-info");

      info.appendChild(
        makeElement("p", "article-date", formatDate(article.date))
      );

      const title = makeElement("h2", "article-title");

      const titleLink = makeElement("a", "", article.title);
      titleLink.href = article.page || "#";

      title.appendChild(titleLink);
      info.appendChild(title);

      info.appendChild(
        makeElement(
          "p",
          "article-description",
          article.description
        )
      );

      const readLink = makeElement("a", "article-read", "read article");
      readLink.href = article.page || "#";

      info.appendChild(readLink);
      card.appendChild(info);

      return card;
    }

    function getSortedArticles() {
      const sorted = [...articles];

      sorted.sort((a, b) => {
        const dateA = a.date
          ? new Date(a.date + "T00:00:00").getTime()
          : NaN;

        const dateB = b.date
          ? new Date(b.date + "T00:00:00").getTime()
          : NaN;

        const hasDateA = Number.isFinite(dateA);
        const hasDateB = Number.isFinite(dateB);

        if (hasDateA && hasDateB && dateA !== dateB) {
          return sortSelect.value === "newest"
            ? dateB - dateA
            : dateA - dateB;
        }

        if (hasDateA !== hasDateB) {
          return hasDateA ? -1 : 1;
        }

        return 0;
      });

      return sorted;
    }

    function renderCatalog() {
      const sortedArticles = getSortedArticles();

      catalogElement.replaceChildren();

      if (sortedArticles.length === 0) {
        catalogElement.appendChild(
          makeElement("p", "empty-state", "no articles found.")
        );
      } else {
        sortedArticles.forEach(article => {
          catalogElement.appendChild(createArticleCard(article));
        });
      }

      resultsCount.textContent =
        sortedArticles.length +
        (sortedArticles.length === 1 ? " article" : " articles");
    }

    sortSelect.addEventListener("change", renderCatalog);

    renderCatalog();
  </script>
</body>
</html>
